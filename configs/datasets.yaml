      Healthy leaf: healthy
      Helopeltis: helopeltis
      Red spider: red_spider_mite
      Tea algal leaf spot: algal_leaf_spot

  - id: csd_assam
    # Main source of blister blight, the most important tea disease in Sri Lanka.
    # Mendeley v1 archive (sha256 07684c2f...2aa9): nested .rar per class, 13,500 images/class
    # (12,829 healthy). Verified 2026-11-15: file <class><k> and <class><k + 1500*j> are the SAME
    # leaf under arbitrary-angle rotation/shift (rotation-invariant colour-histogram intersection
    # 0.96-0.97 vs 0.42-0.54 for random pairs, all classes incl. healthy). So the dataset holds
    # 1,500 unique leaves/class; keeping indices 1..1500 keeps exactly one view of each leaf.
    # Leaves are photographed on a white sheet (not in-canopy field backgrounds).
    crop: tea
    role: known
    fetch:
      method: manual
      url: https://data.mendeley.com/datasets/94fzcdz8gz/1
      max_file_index: 1500
    origin: {country: IN, capture: white_background}
    license: CC BY 4.0
    citation: "Gupta et al. (2025). CS-D: tea leaf disease dataset from Assam. Data in Brief 112251. doi:10.17632/94fzcdz8gz.1"
    use_in_paper: true
    label_map:
      Blister_Blight: blister_blight
      Brown_Blight: brown_blight
      Healthy_leaves: healthy
      Healthy: healthy
      Leaf_Red_Rust: red_rust
      Red_Rust: red_rust
      Red_Spider_Mite: red_spider_mite
      Tea_Mosquito_Bug: helopeltis

  - id: csd_assam_hf
    crop: tea
    role: known
    enabled: false
    fetch: {method: hf, repo: Project-AgML/CS-D_tea_leaf_disease_classification}
    license: CC BY 4.0
    citation: "Same as csd_assam"
    use_in_paper: true
    max_per_class: 1500
    train_only: true
    notes: "Fallback only if the Mendeley original is unavailable. Same 9x augmentation as the original
      (see csd_assam); row order is unknown, so it stays train_only."
    label_map:
      Blister_Blight: blister_blight
      Brown_Blight: brown_blight
      Healthy_leaves: healthy
      Leaf_Red_Rust: red_rust
      Red_Spider_Mite: red_spider_mite
      Tea_Mosquito_Bug: helopeltis

