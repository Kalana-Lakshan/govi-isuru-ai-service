# Registry of every image source used to build the harmonised dataset.
#
# Rules (enforced by govi_ai.data.registry):
#   * No synthetic or generated images. Only real photographs.
#   * Never use a source's "augmented" release: augmented copies leak near-duplicates
#     across splits. HF sources with both configs are pinned to `raw`.
#   * label_map maps each source label -> unified class id from taxonomy.yaml, or null to drop
#     it (ambiguous / mixed labels). Matching ignores case, spaces, '_' and '-'.
#   * Sources with role other_plant / non_plant use label_map "*" (keep everything).
#   * use_in_paper: false marks data whose provenance or licence can't be cited; it can be used
#     to train the deployed model but is excluded from every reported paper number.
#
# fetch.method:
#   hf     - Hugging Face dataset: parquet files downloaded whole, read, then deleted; only the images
#            we keep are written. fetch.max_files caps how many parquet files are read.
#   manual - download the archive yourself (Mendeley etc.), unzip under <raw-root>/<id>/,
#            laid out as <class folder>/<images> (nested folders are fine)
#   local  - a folder you already have (e.g. the legacy Govi Isuru datasets)
#   coco   - COCO val2017 images minus any image containing plants/vegetables/fruit
#
# train_only: true -> never placed in in-domain val/test (use for sources that were augmented at
#   source with transforms the pHash dedupe cannot undo, e.g. zoom/shear).

defaults:
  max_side: 512          # stored images are downscaled to this (training uses <= 384)
  jpeg_quality: 90

